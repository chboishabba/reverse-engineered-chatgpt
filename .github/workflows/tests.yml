name: tests

on:
  push:
    branches:
      - main
      - 'maxcut/**'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[browser]'
          python -m pip install pytest
      - name: Run tests
        run: pytest -q
